name: Build iOS IPA
on: [push]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web App & Generate iOS Project
        run: |
          npm install
          npm run build
          npm install @capacitor/ios
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode Project without signing
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build
          mkdir -p Payload
          mv build/Build/Products/Debug-iphoneos/App.app Payload/ || mv build/Uninstalled-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: ios/App/App.ipa